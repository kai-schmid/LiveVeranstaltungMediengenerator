# Baut die Liedertafel für Windows, macOS und Linux (deb + rpm)
# und hängt alles als Download an ein GitHub-Release.
#
# Automatisch, sobald ein Versions-Tag gepusht wird:
#   git tag v1.2.3
#   git push origin v1.2.3
#
# Manuell für einen bereits vorhandenen Tag:
#   GitHub -> Actions -> "Release" -> "Run workflow" -> Tag eintragen (z.B. v0.1.0)
#
# Tags mit Bindestrich (z.B. v1.3.0-beta.1) werden als Pre-Release veröffentlicht.
# Existiert das Release schon, werden die Dateien ersetzt.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, für den das Release gebaut werden soll (z.B. v0.1.0)'
        required: true

permissions:
  contents: write   # zum Erstellen des Releases

env:
  # Tag aus dem Push bzw. aus der manuellen Eingabe
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux

    steps:
      - name: Code des Tags auschecken
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version aus Tag übernehmen
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: rpm-Werkzeuge installieren
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App bauen
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Kein Code-Signing-Zertifikat: keine Suche im Schlüsselbund (macOS) / Zertifikatspeicher (Windows)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Installationspakete hochladen
        uses: actions/upload-artifact@v4
        with:
          name: liedertafel-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub-Release erstellen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pakete herunterladen
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prüfsummen erzeugen
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Release erstellen bzw. aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG existiert bereits – Dateien werden ersetzt."
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "Liedertafel $RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              $PRERELEASE
          fi

          echo "### Release $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

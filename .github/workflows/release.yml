# Baut die Liedertafel für Windows, macOS und Linux (deb + rpm),
# sobald ein Versions-Tag wie "v1.2.3" gepusht wird, und hängt alles an ein GitHub-Release.
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# Tags mit Bindestrich (z.B. v1.3.0-beta.1) werden als Pre-Release veröffentlicht.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # zum Erstellen des Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version aus Tag übernehmen
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: rpm-Werkzeuge installieren
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App bauen
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Kein Code-Signing-Zertifikat: keine Suche im Schlüsselbund (macOS) / Zertifikatspeicher (Windows)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Installationspakete hochladen
        uses: actions/upload-artifact@v4
        with:
          name: liedertafel-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub-Release erstellen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pakete herunterladen
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prüfsummen erzeugen
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: Liedertafel ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

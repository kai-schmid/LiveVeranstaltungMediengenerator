<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Liedertafel - Vollbild-Vorschau</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .hint {
            position: fixed;
            bottom: 15px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>
    <img id="liveImg" alt="Vorschau">
    <div class="hint" id="hint">Vollbild-Vorschau (ESC oder Doppelklick zum Schließen)</div>
    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('frame-update', (e, dataUrl) => {
            document.getElementById('liveImg').src = dataUrl;
        });

        document.body.addEventListener('dblclick', () => window.close());
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.close();
        });

        setTimeout(() => {
            document.getElementById('hint').style.opacity = '0';
        }, 4000);
    </script>
</body>
</html>
